<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FunGenomics Live — Functional Genomics classroom quiz</title>
  <meta name="description" content="Live classroom quiz game for MBG419 Functional Genomics by Ömer Faruk Bay.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/fg.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧬%3C/text%3E%3C/svg%3E">
  <style>
    main { max-width: 560px; margin: 0 auto; padding: 8vh 1.2rem 3rem; text-align: center; }
    h1 { font-size: clamp(2.6rem, 9vw, 3.8rem); line-height: 1.05; margin: .6rem 0 .8rem; }
    .lead { font-size: 1.15rem; color: var(--text-2); margin-bottom: 2rem; }
    form { display: grid; gap: .8rem; padding: 1.4rem; }
    input { padding: .8em; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border-2);
      text-align: center; font-family: var(--mono); font-size: 1.8rem; letter-spacing: .35em; text-transform: uppercase; }
    input:focus { outline: none; border-color: var(--accent); }
    .host-link { display: inline-block; margin-top: 2rem; color: var(--text-3); font-weight: 600; text-decoration: none; }
    .host-link:hover { color: var(--accent); }
    .back { position: absolute; top: 1rem; left: 1.2rem; color: var(--text-3); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <a class="back" href="../">← omerfarukbay.com</a>
  <button data-theme-toggle class="btn icon ghost" style="position:absolute;top:.6rem;right:1rem">☀️</button>
  <main>
    <p class="eyebrow">MBG419 · Functional Genomics</p>
    <h1 class="brand">🧬 Fun<span class="dna">Genomics</span> Live</h1>
    <p class="lead">Enter the code shown on the classroom screen to join your group.</p>
    <form class="card" action="play.html" method="get">
      <input name="code" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" required aria-label="Game code">
      <button class="btn primary lg" type="submit">Join game →</button>
    </form>
    <a class="host-link" href="host.html">Instructor? Host a game →</a>
  </main>
  <script type="module">
    import { initTheme } from "./js/db.js";
    initTheme();
    const i = document.querySelector("input");
    i.addEventListener("input", () => (i.value = i.value.toUpperCase().replace(/[^A-Z0-9]/g, "")));
  </script>
</body>
</html>
